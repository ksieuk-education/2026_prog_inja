[project]
name = "ai_searching"
version = "0.0.1"
description = ""
authors = [
    {name = "Vladislav Kolokolchikov", email = "KolokolchikovVD@mosreg.ru"},
    {name = "Sergey Gavrilov", email = "GavrilovSerAn@mosreg.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.121.3,<0.122.0)",
    "asyncpg (>=0.30.0,<=0.31.0)",
    "taskiq (>=0.11.20,<0.12.0)",
    "dishka (>=1.7.2,<2.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "pydantic-core (>=2.41.5,<3.0.0)",
    "pydantic-settings[yaml] (>=2.8.1,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "orjson (>=3.10,<4)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "taskiq-aio-pika (>=0.4.4,<0.5.0)",
    "taskiq-dependencies (>=1.5.7,<2.0.0)",
    "taskiq-nats (>=0.6.0,<0.7.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "mosreg-reopsitory"
url = "https://repo.mosreg.ru/repository/mosreg-pypi-proxy/simple"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "ruff (>=0.14.6,<0.15.0)",
    "pytest (>=9.0.1,<10.0.1)",
    "pytest_asyncio (>=1.3.0,<2.0.0)",
    "testcontainers[postgres] (>=4.8.0,<5.0.0)",
    "pytest-cov (>=4.1.0,<5.0.0)",
    "coverage[toml] (>=7.0.0,<8.0.0)"
]
